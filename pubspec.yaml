name: flashcards
description: "Make printed, double-sided flash cards."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  intl: ^0.20.3
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  # Card fonts are loaded as raw bytes for the pdf package only; the UI uses
  # the system font.
  assets:
    - assets/fonts/gentium/
